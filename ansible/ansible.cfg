# Used via ANSIBLE_CONFIG from the Makefile; run Ansible through `make` (ADR-0011).
[defaults]
inventory = inventory.py
roles_path = roles
# remote_user = TODO   # SSH user per host is open question 4; set it in group_vars/<role>.yml as ansible_user
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
result_format = yaml
retry_files_enabled = false

[ssh_connection]
pipelining = true
