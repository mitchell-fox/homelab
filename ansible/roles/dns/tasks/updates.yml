# Automatic updates: OS packages through unattended-upgrades, blocklists through a daily timer.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Turn on daily package updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Choose which package sources update automatically
  ansible.builtin.template:
    src: 52homelab-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install the Pi-hole image update script
  ansible.builtin.template:
    src: pihole-update.sh.j2
    dest: "{{ pihole_dir }}/pihole-update.sh"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the blocklist and image update services and timers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    - pihole-gravity.service
    - pihole-gravity.timer
    - pihole-update.service
    - pihole-update.timer

- name: Turn on the update timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - pihole-gravity.timer
    - pihole-update.timer
