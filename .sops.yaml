# sops encryption rules (ADR-0004). Any file matching a path_regex is encrypted to the listed age recipients.
# Public keys only; private keys never go in this repo.
creation_rules:
  - path_regex: secrets/.*\.sops\.ya?ml$
    # workstation-tpm: sealed in mitch-desktop-linux's TPM, daily use (ADR-0015)
    # backup: plain age key, kept only in the password manager; recovery if the TPM key is lost
    age: >-
      age1tpm1q09c07vxk2lygweggweu0vs5fmwwz7c5fmrye7cccfu9xttxk97rz9k4s4k,
      age18fr9jr7uxkgjx6jvvgxq8s2x26neg07wxx9saeaq9rufgrk9ld3sgyrldu
